<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Filter for soft drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <radialGradient id="purpleBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F388E"/>
      <stop offset="70%" stop-color="#38256E"/>
      <stop offset="100%" stop-color="#24174D"/>
    </radialGradient>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8F9CA8"/>
      <stop offset="50%" stop-color="#606C78"/>
      <stop offset="100%" stop-color="#3A434C"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="robotBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#243042"/>
      <stop offset="100%" stop-color="#1A2230"/>
    </linearGradient>
    <filter id="eyeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Shadowed Cog -->
  <g filter="url(#shadow)">
    <!-- Main Industrial Gear Body -->
    <path d="M 230,28 L 282,28 L 290,75 C 314,83 336,95 356,110 L 400,88 L 436,124 L 414,168 C 429,188 441,210 449,234 L 496,242 L 496,294 L 449,302 C 441,326 429,348 414,368 L 436,412 L 400,448 L 356,426 C 336,441 314,453 290,461 L 282,508 L 230,508 L 222,461 C 198,453 176,441 156,426 L 112,448 L 76,412 L 98,368 C 83,348 71,326 63,302 L 16,294 L 16,242 L 63,234 C 71,210 83,188 98,168 L 76,124 L 112,88 L 156,110 C 176,95 198,83 222,75 Z"
          fill="url(#gearGrad)" stroke="#1E2328" stroke-width="8" stroke-linejoin="round"/>

    <!-- Inner Metallic Blades / Iris Swooshes -->
    <path d="M 120,380 C 120,240 220,130 360,110 C 310,95 240,105 180,150 C 130,190 100,260 106,340 Z"
          fill="url(#bladeGrad)" stroke="#1E2328" stroke-width="4"/>
    <path d="M 106,340 C 140,430 240,470 330,440 C 270,450 190,430 140,380 Z"
          fill="#4B5563" stroke="#1E2328" stroke-width="4"/>

    <!-- Center Tech Disc with Circuit Board -->
    <circle cx="256" cy="265" r="145" fill="url(#purpleBg)" stroke="#1E2328" stroke-width="7"/>

    <!-- Gold PCB Circuit Traces -->
    <g stroke="#EAB308" stroke-width="3" fill="none" opacity="0.85">
      <!-- Trace lines -->
      <path d="M 210,140 L 210,170 L 240,170"/>
      <path d="M 310,140 L 310,165 L 290,185"/>
      <path d="M 360,190 L 330,190 L 320,205"/>
      <path d="M 150,230 L 180,230 L 190,215"/>
      <path d="M 140,310 L 175,310 L 185,330"/>
      <path d="M 365,300 L 335,300 L 325,320 L 325,360"/>
      <path d="M 210,380 L 235,380 L 255,360 L 285,360 L 285,390"/>
      <!-- Circuit Vias / Nodes -->
      <circle cx="210" cy="140" r="3.5" fill="#EAB308"/>
      <circle cx="310" cy="140" r="3.5" fill="#EAB308"/>
      <circle cx="360" cy="190" r="3.5" fill="#EAB308"/>
      <circle cx="150" cy="230" r="3.5" fill="#EAB308"/>
      <circle cx="140" cy="310" r="3.5" fill="#EAB308"/>
      <circle cx="365" cy="300" r="3.5" fill="#EAB308"/>
      <circle cx="210" cy="380" r="3.5" fill="#EAB308"/>
      <circle cx="285" cy="390" r="3.5" fill="#EAB308"/>
    </g>

    <!-- Inner Dark Ring Accent -->
    <circle cx="256" cy="265" r="110" fill="none" stroke="#2D1C59" stroke-width="12"/>

    <!-- Antennas of the Robot -->
    <g stroke="#1E2328" stroke-width="4">
      <!-- Left antenna -->
      <rect x="200" y="165" width="8" height="22" fill="#3A4D63" rx="3"/>
      <circle cx="204" cy="160" r="7" fill="#4B6382"/>
      <!-- Right antenna -->
      <rect x="304" y="165" width="8" height="22" fill="#3A4D63" rx="3"/>
      <circle cx="308" cy="160" r="7" fill="#4B6382"/>
    </g>

    <!-- Robot Monitor Head Body -->
    <rect x="160" y="180" width="192" height="135" rx="20"
          fill="url(#robotBody)" stroke="#0F172A" stroke-width="7"/>

    <!-- Inner Screen Bezel Highlight -->
    <rect x="166" y="186" width="180" height="123" rx="15"
          fill="none" stroke="#475569" stroke-width="2" opacity="0.4"/>

    <!-- Robot Glowing Oval Eyes -->
    <g filter="url(#eyeGlow)">
      <!-- Left Eye -->
      <ellipse cx="220" cy="245" rx="22" ry="36" fill="#FFFFFF"/>
      <ellipse cx="216" cy="238" rx="8" ry="14" fill="#F0FDF4" opacity="0.6"/>

      <!-- Right Eye -->
      <ellipse cx="292" cy="245" rx="22" ry="36" fill="#FFFFFF"/>
      <ellipse cx="288" cy="238" rx="8" ry="14" fill="#F0FDF4" opacity="0.6"/>
    </g>
  </g>
</svg>
