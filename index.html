<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SensorTech - Planta 4.0 VR</title>
  
  <!-- Librería principal de A-Frame para WebXR -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- Script que detecta las interacciones de los mandos de Meta Quest -->
  <script>
    AFRAME.registerComponent('interaccion-mandos', {
      init: function () {
        var el = this.el;

        // ACCIÓN 1: Al apretar el GATILLO FRONTAL (Para tocar pantallas)
        el.addEventListener('triggerdown', function (evt) {
          var interceptados = el.components.raycaster.intersectedEls;
          if (interceptados.length > 0) {
            var objeto = interceptados[0];
            
            // Lógica para la Pantalla IoT
            if (objeto.id === 'pantalla-iot') {
              console.log("Pantalla de SensorTech activada");
              objeto.setAttribute('color', '#00ff00'); // Cambia a verde al hacer clic
              // Aquí en el futuro llamaremos a la base de datos de los sensores BME280
            }
          }
        });

        // ACCIÓN 2: Al apretar el BOTÓN DE AGARRE LATERAL (Para jalar palancas)
        el.addEventListener('gripdown', function (evt) {
          var interceptados = el.components.raycaster.intersectedEls;
          if (interceptados.length > 0) {
            var objeto = interceptados[0];
            
            // Lógica para la Palanca
            if (objeto.id === 'palanca-nave8') {
              console.log("Palanca de Nave 8 activada");
              objeto.setAttribute('rotation', '45 0 0'); // Inclina la palanca hacia adelante
            }
          }
        });

        // ACCIÓN 3: Al soltar el BOTÓN DE AGARRE LATERAL (La palanca regresa)
        el.addEventListener('gripup', function (evt) {
          var palanca = document.querySelector('#palanca-nave8');
          if (palanca) {
            palanca.setAttribute('rotation', '0 0 0'); // Regresa a su posición original
          }
        });
      }
    });
  </script>
</head>
<body>

  <!-- Inicia la Escena VR -->
  <!-- El cursor="rayOrigin: mouse" permite que también puedas dar clic con el mouse en la PC -->
  <a-scene cursor="rayOrigin: mouse" raycaster="objects: .interactivo">
    
    <!-- Aquí es donde debes cargar tus modelos 3D (.glb o .gltf) de tu fábrica en el futuro -->
    <a-assets>
      <!-- Ejemplo: <a-asset-item id="fabrica-modelo" src="ruta/a/tu/modelo.glb"></a-asset-item> -->
    </a-assets>

    <!-- ============================================== -->
    <!-- RIG DEL JUGADOR (CÁMARA Y MANDOS DE META QUEST)-->
    <!-- ============================================== -->
    <a-entity id="jugador" position="0 0 0">
      
      <!-- Cámara / Cabeza (Altura promedio de 1.6 metros) -->
      <a-camera position="0 1.6 0"></a-camera>

      <!-- Mando Izquierdo: Configurado para Meta Quest, con láser rojo que apunta a los objetos clase "interactivo" -->
      <a-entity id="mandoIzquierdo" 
                oculus-touch-controls="hand: left" 
                raycaster="objects: .interactivo; far: 5; showLine: true" 
                line="color: red; opacity: 0.7"
                interaccion-mandos>
      </a-entity>

      <!-- Mando Derecho: Configurado para Meta Quest, con láser rojo -->
      <a-entity id="mandoDerecho" 
                oculus-touch-controls="hand: right" 
                raycaster="objects: .interactivo; far: 5; showLine: true" 
                line="color: red; opacity: 0.7"
                interaccion-mandos>
      </a-entity>
    </a-entity>

    <!-- ============================================== -->
    <!-- ELEMENTOS INTERACTIVOS DE PRUEBA DE SENSORTECH -->
    <!-- ============================================== -->

    <!-- 1. Pantalla IoT de SensorTech (Detecta el Gatillo) -->
    <a-box class="interactivo" 
           id="pantalla-iot" 
           position="-1.5 1.5 -3" 
           width="1.5" height="1" depth="0.1" 
           color="#0055ff">
           <a-text value="Tocar Pantalla\nSensorTech" align="center" position="0 0 0.06" color="#ffffff"></a-text>
    </a-box>

    <!-- 2. Palanca interactiva Nave 8 (Detecta el botón de agarre) -->
    <a-entity position="1.5 1 -3">
      <a-text value="Palanca Nave 8" align="center" position="0 0.6 0" color="#000000" scale="0.8 0.8 0.8"></a-text>
      <!-- Base oscura de la palanca -->
      <a-box width="0.4" height="0.1" depth="0.4" color="#333333"></a-box>
      <!-- Cilindro rojo de la palanca (Este es el que rota) -->
      <a-cylinder class="interactivo" 
                  id="palanca-nave8" 
                  position="0 0.25 0" 
                  radius="0.05" height="0.5" 
                  color="#ff0000">
      </a-cylinder>
    </a-entity>

    <!-- ============================================== -->
    <!-- ENTORNO BÁSICO (PISO Y CIELO)                  -->
    <!-- ============================================== -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#d3d3d3"></a-plane>
    <a-sky color="#e6f2ff"></a-sky>
    
  </a-scene>
</body>
</html>
