<script>
  AFRAME.registerComponent('interaccion-mandos', {
    init: function () {
      var el = this.el;

      // Al apretar el gatillo frontal (Para botones o pantallas)
      el.addEventListener('triggerdown', function (evt) {
        var interceptados = el.components.raycaster.intersectedEls;
        if (interceptados.length > 0) {
          var objeto = interceptados[0];
          
          // Cambia 'boton-inicio' por el ID real de tu botón "Haz clic para iniciar"
          if (objeto.id === 'boton-inicio') {
            console.log("Botón presionado con el mando VR");
            // Aquí pones la acción para quitar la pantalla de inicio
          }
        }
      });

      // Al apretar el botón de agarre lateral (Para palancas o piezas)
      el.addEventListener('gripdown', function (evt) {
        var interceptados = el.components.raycaster.intersectedEls;
        if (interceptados.length > 0) {
          var objeto = interceptados[0];
          console.log("Objeto agarrado: ", objeto.id);
          // Aquí puedes agregar animaciones para rotar o mover objetos
        }
      });
    }
  });
</script>
