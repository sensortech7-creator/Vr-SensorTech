<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SensorTech - Planta 4.0 VR</title>
  
  <!-- Librería de A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- Lógica de interacciones para mandos VR -->
  <script>
    AFRAME.registerComponent('interaccion-mandos', {
      init: function () {
        var el = this.el;

        // Gatillo frontal
        el.addEventListener('triggerdown', function (evt) {
          var interceptados = el.components.raycaster.intersectedEls;
          if (interceptados.length > 0) {
            var objeto = interceptados[0];
            
            // Ocultar botón cyan de inicio
            if (objeto.id === 'boton-inicio') {
              objeto.setAttribute('visible', 'false');
              objeto.classList.remove('interactivo');
            }
            
            // Tocar pantalla IoT
            if (objeto.classList.contains('pantalla-tactil')) {
              objeto.setAttribute('color', '#00ff00');
            }
          }
        });

        // Botón de agarre (Grip) para palancas
        el.addEventListener('gripdown', function (evt) {
          var interceptados = el.components.raycaster.intersectedEls;
          if (interceptados.length > 0) {
            var objeto = interceptados[0];
            if (objeto.classList.contains('palanca')) {
              objeto.setAttribute('rotation', '45 0 0');
            }
          }
        });

        // Soltar palanca
        el.addEventListener('gripup', function (evt) {
          var palancas = document.querySelectorAll('.palanca');
          palancas.forEach(function(p) {
            p.setAttribute('rotation', '0 0 0');
          });
        });
      }
    });
  </script>
</head>
<body>

  <!-- Escena principal -->
  <a-scene cursor="rayOrigin: mouse" raycaster="objects: .interactivo" background="color: #e6e6e6">
    
    <!-- Jugador, Cámara y Mandos Meta Quest -->
    <a-entity position="0 0 4">
      <a-camera position="0 1.6 0"></a-camera>
      <!-- Mando Izquierdo -->
      <a-entity oculus-touch-controls="hand: left" 
                raycaster="objects: .interactivo; far: 5; showLine: true" 
                line="color: cyan; opacity: 0.8" 
                interaccion-mandos></a-entity>
      <!-- Mando Derecho -->
      <a-entity oculus-touch-controls="hand: right" 
                raycaster="objects: .interactivo; far: 5; showLine: true" 
                line="color: cyan; opacity: 0.8" 
                interaccion-mandos></a-entity>
    </a-entity>

    <!-- Piso base -->
    <a-plane rotation="-90 0 0" width="50" height="50" color="#cccccc"></a-plane>
    <!-- Camino azul central -->
    <a-plane rotation="-90 0 0" position="0 0.01 0" width="4" height="20" color="#2A4B7C"></a-plane>

    <!-- Fachada ACCESO NAVE 8 -->
    <a-box position="-3.5 2.5 -4" width="2" height="5" depth="1" color="#0A192F"></a-box>
    <a-box position="3.5 2.5 -4" width="2" height="5" depth="1" color="#0A192F"></a-box>
    <a-box position="0 5.5 -4" width="9" height="1.5" depth="1" color="#0A192F">
      <a-text value="ACCESO NAVE 8" align="center" position="0 0 0.51" scale="2 2 2" color="#FFFFFF"></a-text>
    </a-box>

    <!-- Botón interactivo central -->
    <a-box id="boton-inicio" class="interactivo" position="0 1.5 -1" width="4" height="0.6" depth="0.1" color="#00FFFF">
      <a-text value="Haz clic con el gatillo para iniciar la experiencia VR" align="center" position="0 0 0.06" color="#000000" scale="0.9 0.9 0.9"></a-text>
    </a-box>

    <!-- Panel de Sensor IoT (Lado izquierdo) -->
    <a-box class="interactivo pantalla-tactil" position="-3 2 -2" width="2" height="1.5" depth="0.1" color="#112240">
       <a-text value="ESTADO MAQUINA 1\nSensor BME280" align="center" position="0 0.2 0.06" color="#00FFFF"></a-text>
    </a-box>

    <!-- Palanca (Lado derecho) -->
    <a-entity position="3 1 -2">
      <a-box width="0.4" height="0.1" depth="0.4" color="#333333"></a-box>
      <a-cylinder class="interactivo palanca" position="0 0.3 0" radius="0.04" height="0.6" color="#FF3333"></a-cylinder>
    </a-entity>

  </a-scene>
</body>
</html>
